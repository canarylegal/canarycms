name: Portal smoke

# Live HTTP smoke for client portal quote / form / Canary Sign flows.
# Spins up db+backend, ensures the 000002 fixture, then runs smoke_portal_flows.py.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'
    branches: [main]
    paths:
      - "backend/app/routers/portal.py"
      - "backend/app/portal_*.py"
      - "backend/app/canary_sign*.py"
      - "backend/app/quote_portal*.py"
      - "backend/scripts/smoke_portal_flows.py"
      - "backend/scripts/ensure_portal_smoke_fixture.py"
      - "scripts/smoke-portal.sh"
      - ".github/workflows/portal-smoke.yml"
      - "docker-compose.yml"
      - "backend/requirements.txt"
      - "backend/Dockerfile"
  pull_request:
    paths:
      - "backend/app/routers/portal.py"
      - "backend/app/portal_*.py"
      - "backend/app/canary_sign*.py"
      - "backend/app/quote_portal*.py"
      - "backend/scripts/smoke_portal_flows.py"
      - "backend/scripts/ensure_portal_smoke_fixture.py"
      - "scripts/smoke-portal.sh"
      - ".github/workflows/portal-smoke.yml"
      - "docker-compose.yml"
      - "backend/requirements.txt"
      - "backend/Dockerfile"

jobs:
  portal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      BACKEND_CONTAINER: canaryci-backend
    steps:
      - uses: actions/checkout@v6

      - name: Write CI .env
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'cryptography>=42'
          FERNET="$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          {
            echo "COMPOSE_PROJECT_NAME=canaryci"
            echo "COMPOSE_PROFILES="
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "DATA_ENCRYPTION_KEY=${FERNET}"
            echo "ONLYOFFICE_JWT_SECRET=$(openssl rand -hex 32)"
            echo "ONLYOFFICE_SECURE_LINK_SECRET=$(openssl rand -hex 32)"
            echo "MASTER_ADMIN_LOGIN=ci-master-$(openssl rand -hex 8)"
            echo "MASTER_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "MASTER_ADMIN_REQUIRE_2FA=false"
            echo "MASTER_ADMIN_TOTP_SECRET="
            echo "POSTGRES_USER=canary"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=canary"
            echo "CANARY_PUBLIC_URL=http://127.0.0.1:8080"
            echo "CANARY_CORS_ORIGINS=http://127.0.0.1:8080"
            echo "ONLYOFFICE_DS_PUBLIC_URL=http://127.0.0.1:8080/office-ds"
            echo "CANARY_CALDAV_PUBLIC_URL=http://127.0.0.1:8080"
            echo "CANARY_GITHUB_DEPLOY_REF=latest-release"
            echo "BACKEND_PORT_PUBLISH=127.0.0.1:18000:8000"
            echo "POSTGRES_PORT_PUBLISH=127.0.0.1:15432:5432"
            echo "FRONTEND_PORT_PUBLISH=127.0.0.1:18080:80"
            echo "ONLYOFFICE_PORT_PUBLISH=127.0.0.1:18084:80"
            echo "RADICALE_PORT_PUBLISH=127.0.0.1:15232:5232"
          } > .env

      - name: Build and start db + backend
        run: |
          set -euo pipefail
          docker compose up -d --build --wait --wait-timeout 360 db backend
          docker compose ps

      - name: Verify backend /health on published port
        run: |
          set -euo pipefail
          curl -fsS --retry 12 --retry-all-errors --retry-delay 5 \
            http://127.0.0.1:18000/health
          docker compose exec -T backend python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"

      - name: Portal smoke (ensure fixture)
        run: ./scripts/smoke-portal.sh --ensure-fixture

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=300 backend db || true
