name: Core workflows

# Run on every PR and main update: API, migrations, styles and documents all affect these journeys.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']

jobs:
  core-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Test deployment safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test real PostgreSQL and browser workflows
        run: ./scripts/test-core-workflows.sh
      - name: Upload workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-workflow-results
          path: artifacts/core-workflows/
          if-no-files-found: warn
