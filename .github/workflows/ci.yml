name: CI

on:
  push:
  pull_request:

jobs:
  commercial-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check immutable build inputs
        run: python3 scripts/check_build_pins.py
      - name: Test deployment and recovery safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Guard commercial vendor ownership
        run: python3 scripts/check_commercial_boundary.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/build-requirements.lock
      - run: pip install --require-hashes -r build-requirements.lock
      - run: pip install --require-hashes --no-build-isolation -r requirements.lock
      - run: pip check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm test
      - run: npm run build
