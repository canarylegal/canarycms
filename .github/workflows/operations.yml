name: Operational recovery
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test encrypted backup, dependency failures and isolated recovery
        run: ./scripts/test-operations.sh
      # Backup directories contain database/files, encryption keys and resolved credentials.
      # Deliberately never upload them as GitHub artifacts, even on failure.
