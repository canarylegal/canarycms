x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Local dev: cloudflared reaches nginx via 127.0.0.1:8080 inside the frontend network namespace.
# Requires Cloudflare tunnel origin: http://127.0.0.1:8080 (not 172.17.0.1:8080).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev-tunnel.yml --profile prod up -d
#
# After rebuilding/recreating frontend, also recreate the tunnel sidecars (they share its network stack):
#   docker compose -f docker-compose.yml -f docker-compose.dev-tunnel.yml --profile prod up -d --force-recreate cloudflared-socat cloudflared-dev
#
# Set CLOUDFLARE_TUNNEL_TOKEN_DEV in .env (dev.canarylegalsoftware.co.uk tunnel token).

services:
  frontend:
    ports: !reset []

  cloudflared-socat:
    logging: *bounded-logging
    profiles: [prod]
    image: alpine/socat:1.0.5@sha256:539ad796e9d359596dbf4b7b7ce626e37f71bcce0a8af7bd1d2adad7c29ea787
    container_name: canary-cloudflared-socat
    restart: unless-stopped
    network_mode: "service:frontend"
    cap_add:
      - NET_ADMIN
    depends_on:
      frontend:
        condition: service_started
        restart: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ip addr add 172.17.0.1/32 dev lo 2>/dev/null || true
        socat TCP-LISTEN:8080,bind=127.0.0.1,fork,reuseaddr TCP:127.0.0.1:80 &
        exec socat TCP-LISTEN:8080,bind=172.17.0.1,fork,reuseaddr TCP:127.0.0.1:80

  cloudflared-dev:
    logging: *bounded-logging
    profiles: [prod]
    image: cloudflare/cloudflared:latest@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    container_name: canary-cloudflared-dev
    restart: unless-stopped
    network_mode: "service:frontend"
    depends_on:
      cloudflared-socat:
        condition: service_started
        restart: true
      frontend:
        condition: service_started
        restart: true
    command:
      - tunnel
      - --no-autoupdate
      - --edge-ip-version
      - "4"
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN_DEV:?Set CLOUDFLARE_TUNNEL_TOKEN_DEV in .env}
