# CI-only overrides: unique container names + longer health grace on cold runners.
# Usage: COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml docker compose ...

services:
  db:
    container_name: canaryci-db
  backend:
    container_name: canaryci-backend
    # Full healthcheck block (Compose replaces the mapping; keep the test command).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 120s
